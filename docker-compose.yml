services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cardbilling
      POSTGRES_USER: cardbilling
      POSTGRES_PASSWORD: cardbilling
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardbilling"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  postgres-data:
