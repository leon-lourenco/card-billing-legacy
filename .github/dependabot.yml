version: 2
updates:
  # One multi-module Maven reactor rooted here - Dependabot understands the module list from
  # the parent pom, so a single entry covers every module.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the actions this repo's own workflow pins current. The reusable workflows living in
  # ci-templates have their own Dependabot config over there - this only covers what's pinned
  # directly in this repo's own workflow file.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
